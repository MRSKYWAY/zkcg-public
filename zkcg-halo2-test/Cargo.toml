[package]
name = "zkcg-halo2-test"
version = "0.1.0"
edition = "2024"
description = "Reusable security-testing primitives for Halo2-based proof systems"
license = "Apache-2.0"
repository = "https://github.com/MRSKYWAY/ZKCG"
readme = "README.md"
keywords = ["halo2", "zero-knowledge", "security", "testing", "fuzzing"]
categories = ["cryptography", "development-tools::testing"]

[features]
default = []
halo2 = ["dep:halo2_proofs"]

[dependencies]
halo2_proofs = { version = "0.3.2", optional = true }
